services:
  - type: worker
    name: anonimbot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python anonimbot.py
    disk:
      name: anonimbot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: REVEAL_PRICE_STARS
        value: "50"
      - key: DB_PATH
        value: /data/anonimbot.db
